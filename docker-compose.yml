services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Shared with `collab`: the web app signs room tokens, the collab server verifies them.
      COLLAB_TOKEN_SECRET: ${COLLAB_TOKEN_SECRET}
      NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-ws://localhost:1234}
    depends_on:
      - collab

  collab:
    build:
      context: .
      dockerfile: collab/Dockerfile
    ports:
      - "1234:1234"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      COLLAB_TOKEN_SECRET: ${COLLAB_TOKEN_SECRET}
      COLLAB_PORT: "1234"
