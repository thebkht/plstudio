# Run with:  docker compose --env-file .env.local up --build
#
# One service: `server.ts` runs Next and the Hocuspocus collab socket on the same
# port, so the browser reaches collab at ws://<host>:5555/collab.
#
# `restart: unless-stopped` brings the service back when the Docker daemon
# starts, but only for containers that already exist and were not stopped by
# hand. `scripts/boot-drawsql.sh` (wired to a LaunchAgent, see README) covers
# the rest: it starts Docker Desktop itself and runs `up -d` from cold.
#
# `--env-file` feeds ${...} interpolation below (compose reads `.env` otherwise);
# `env_file:` puts the same values inside the containers at runtime.
#
# DATA_DIR is a named volume, not a bind mount into the repo: this checkout lives
# under ~/Documents, which macOS redirects into iCloud Drive, and having a sync
# daemon own the durable store cost us every project once already.
#
# The trade-off is that the files are no longer browsable from the host. To look:
#   docker compose run --rm -v drawsql_app-data:/d --entrypoint sh web -c 'ls -R /d'
# and to back up or move to another machine:
#   ./scripts/data-backup.sh   /   ./scripts/data-restore.sh <file.tgz|dir>
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time only: Next inlines it. Collab is on unless this is `off`.
        NEXT_PUBLIC_COLLAB: ${NEXT_PUBLIC_COLLAB:-}
    env_file:
      - .env.local
    environment:
      DATA_DIR: /data
      # Under mem_limit, with room left for the native heap (sockets, Yjs buffers).
      NODE_OPTIONS: --max-old-space-size=${WEB_HEAP_MB:-768}
    # Caps so a busy collab session cannot take every core from the host's own
    # browser, which is usually editing on the same machine. Raise them on a
    # dedicated server; on a 512 MB host, WEB_MEM_LIMIT=448m WEB_HEAP_MB=320
    # WEB_CPUS=1 in the env file leaves the OS its share.
    cpus: "${WEB_CPUS:-2}"
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    volumes:
      - app-data:/data
    ports:
      - "5555:3000"
    restart: unless-stopped

volumes:
  app-data:
